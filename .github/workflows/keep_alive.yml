name: Wake Streamlit Apps

on:
  schedule:
    # KST 06:07, 11:07, 16:07, 21:07 (UTC the previous/same day)
    - cron: '7 21,2,7,12 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: wake-streamlit-apps
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wake Streamlit apps
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import re
          from playwright.async_api import async_playwright, TimeoutError as BrowserTimeout
          
          APPS = [
              ("Vaccination", "https://hismedi-vaccination.streamlit.app/"),
              ("Parking", "https://hismedi-parking.streamlit.app/"),
              ("Drugs", "https://hismedi-app-f9r3rufhcehlfn7zgq6qtq.streamlit.app/"),
              ("Medical", "https://hismedi-app-medical.streamlit.app/"),
              ("Unpaid", "https://hismedi-app-unpaid.streamlit.app/"),
              ("Kiosk", "https://hismedi-app-kiosk.streamlit.app/"),
          ]
          
          async def wake(browser, name, url):
              for attempt in (1, 2):
                  context = await browser.new_context(locale="en-US")
                  page = await context.new_page()
                  try:
                      try:
                          response = await page.goto(url, wait_until="domcontentloaded", timeout=20000)
                      except BrowserTimeout:
                          response = None  # The page may still be loading; check its buttons.
                      for _ in range(12):
                          for frame in page.frames:
                              button = frame.get_by_role("button", name=re.compile(r"get this app back up", re.I))
                              if await button.count() and await button.first.is_visible():
                                  await button.first.click(timeout=5000)
                                  print(f"{name}: wake button clicked", flush=True)
                                  await page.wait_for_timeout(3500)
                                  return name, True
                          if response and response.status < 400 and page.url.startswith(url.rstrip('/')):
                              print(f"{name}: page opened ({response.status})", flush=True)
                              return name, True
                          await page.wait_for_timeout(1000)
                      print(f"{name}: attempt {attempt} did not open", flush=True)
                  except Exception as exc:
                      print(f"{name}: attempt {attempt} error ({type(exc).__name__})", flush=True)
                  finally:
                      await context.close()
                  if attempt == 1:
                      await asyncio.sleep(3)
              print(f"::warning::{name}: could not confirm page access or wake click", flush=True)
              return name, False
          
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  try:
                      # Three browsers at once, without slow WebSocket/UI validation.
                      sem = asyncio.Semaphore(3)
                      async def limited(name, url):
                          async with sem:
                              return await wake(browser, name, url)
                      results = await asyncio.gather(*(limited(n, u) for n, u in APPS))
                  finally:
                      await browser.close()
              for name, ok in results:
                  print(f"{name}: {'OK' if ok else 'CHECK NEEDED'}", flush=True)
              # A single restricted client (e.g. kiosk) must not cause false all-jobs-failed emails.
              # Warnings are still shown for any app that could not be reached.
              return 0
          
          raise SystemExit(asyncio.run(main()))
          PY
