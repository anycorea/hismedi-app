name: Wake Streamlit Apps

on:
  schedule:
    # 한국시간 매일 06:07 / 18:07
    - cron: '7 9,21 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: wake-streamlit-apps
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Wake apps and report results
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import os
          import re
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.async_api import async_playwright, Error

          APPS = [
              ('인증', 'https://hismedi-app-nlyfdy5m68hfmnafchqbrr.streamlit.app/'),
              ('모바일진료예약', 'https://hismedi-app-2tjy6mrzdvuu2ohmb6cihq.streamlit.app/'),
              ('주요업무보고', 'https://hismedi-app-akdbdih2rgeo5pzzkvj2ig.streamlit.app/'),
              ('약무업무', 'https://hismedi-app-f9r3rufhcehlfn7zgq6qtq.streamlit.app/'),
              ('인사관리', 'https://hismedi-app-a3cyqhakd7fpgnnn3ugezs.streamlit.app/'),
              ('의료진안내', 'https://hismedi-app-medical.streamlit.app/'),
              ('뉴스스크랩', 'https://hismedi-app-vsvzyqge54k9qb6vnfl8n2.streamlit.app/'),
              ('모바일주차등록', 'https://hismedi-parking.streamlit.app/'),
              ('내과처방현황', 'https://hismedi-app-pnzu8rxkdsryeq2www5hu8.streamlit.app/'),
              ('진료실적보고', 'https://hismedi-app-report.streamlit.app/'),
              ('백신통계', 'https://hismedi-app-stat-vac.streamlit.app/'),
              ('비급여안내', 'https://hismedi-app-unpaid.streamlit.app/'),
              ('예방접종예진표', 'https://hismedi-vaccination.streamlit.app/'),
              ('키오스크', 'https://hismedi-app-kiosk.streamlit.app/'),
              ('주간업무보고', 'https://hismedi-app-h6jc8egutxhnhafthftq89.streamlit.app/'),
          ]
          WAKE = re.compile(r'Yes, get this app back up!|get this app back up|앱.*깨우', re.I)
          PARALLEL = 6
          MAX_ATTEMPTS = 2
          ATTEMPT_LIMIT = 65
          STABLE_SECONDS = 8

          async def inspect(browser, sem, name, url):
              async with sem:
                  missing_count = 0
                  for attempt in range(1, MAX_ATTEMPTS + 1):
                      context = await browser.new_context(locale='en-US')
                      page = await context.new_page()
                      page.set_default_timeout(4000)
                      clicked = False
                      last_http = None
                      seen_app = False
                      seen_stream = False
                      ws_connected = set()

                      def on_ws(ws):
                          if '/_stcore/stream' in ws.url:
                              ws_connected.add(ws.url)
                              ws.on('close', lambda _=None, addr=ws.url: ws_connected.discard(addr))
                      page.on('websocket', on_ws)
                      print(f'{name}: attempt {attempt}/{MAX_ATTEMPTS}', flush=True)
                      try:
                          try:
                              response = await page.goto(url, wait_until='domcontentloaded', timeout=20000)
                              last_http = response.status if response else None
                              saw_404 = last_http == 404
                              if saw_404:
                                  missing_count += 1
                                  print(f'{name}: HTTP 404 (attempt {attempt})', flush=True)
                                  if missing_count >= MAX_ATTEMPTS:
                                      return (name, 'SKIP_404')
                                  continue
                          except Error:
                              print(f'{name}: initial navigation delayed', flush=True)

                          deadline = time.monotonic() + ATTEMPT_LIMIT
                          stable_since = None
                          last_click = 0
                          while time.monotonic() < deadline:
                              for frame in page.frames:
                                  try:
                                      button = frame.get_by_role('button', name=WAKE).first
                                      if await button.count() and await button.is_visible():
                                          if time.monotonic() - last_click > 15:
                                              await button.click(timeout=3000)
                                              clicked = True
                                              last_click = time.monotonic()
                                              print(f'{name}: wake button clicked', flush=True)
                                  except Error:
                                      pass

                              ready = False
                              try:
                                  app = page.locator('[data-testid="stAppViewContainer"]').first
                                  err = page.locator('[data-testid="stException"]').first
                                  seen_app = bool(await app.count() and await app.is_visible())
                                  seen_stream = seen_stream or bool(ws_connected)
                                  has_error = bool(await err.count() and await err.is_visible())
                                  ready = seen_app and not has_error and bool(ws_connected)
                              except Error:
                                  pass

                              if ready:
                                  if stable_since is None:
                                      stable_since = time.monotonic()
                                  if time.monotonic() - stable_since >= STABLE_SECONDS:
                                      outcome = 'WAKE+READY' if clicked else 'READY'
                                      print(f'{name}: {outcome}', flush=True)
                                      return (name, outcome)
                              else:
                                  stable_since = None
                              await asyncio.sleep(2)
                      except Exception as exc:
                          print(f'{name}: browser issue ({type(exc).__name__})', flush=True)
                      finally:
                          print(f'{name}: attempt={attempt} http={last_http} wake_clicked={clicked} '
                                f'app_visible={seen_app} socket_seen={seen_stream}', flush=True)
                          await context.close()

                      if attempt < MAX_ATTEMPTS:
                          await asyncio.sleep(2)

                  print(f'::warning::{name}: not confirmed awake', flush=True)
                  return (name, 'NOT_READY')

          async def main():
              semaphore = asyncio.Semaphore(PARALLEL)
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  try:
                      results = await asyncio.gather(*(
                          inspect(browser, semaphore, name, url) for name, url in APPS
                      ))
                  finally:
                      await browser.close()
              stamp = datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d %H:%M KST')
              lines = [f'## Streamlit wake check — {stamp}', '', '| 앱 | 결과 |', '|---|---|']
              lines += [f'| {name} | {status} |' for name, status in results]
              lines += ['', 'READY = Streamlit app shell and active WebSocket observed for 8 seconds. '
                        'This does not validate hospital functions or guarantee that the app remains awake.']
              report = '\n'.join(lines) + '\n'
              print(report, flush=True)
              path = os.getenv('GITHUB_STEP_SUMMARY')
              if path:
                  with open(path, 'a', encoding='utf-8') as fp:
                      fp.write(report)
              return 1 if any(status == 'NOT_READY' for _, status in results) else 0

          raise SystemExit(asyncio.run(main()))
          PY
