name: Wake Streamlit Apps

on:
  schedule:
    # Daily at 06:07 and 06:37 KST (21:07 and 21:37 UTC the previous day)
    - cron: '7,37 21 * * *'
  workflow_dispatch:

# No repository checkout, commits, secrets, or write permission needed.
permissions: {}

concurrency:
  group: wake-streamlit-apps
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Wake apps and verify rendered sessions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import time
          from datetime import datetime
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright, Error

          APPS = [
              ('Vaccination', 'https://hismedi-vaccination.streamlit.app/'),
              ('Parking', 'https://hismedi-parking.streamlit.app/'),
          ]
          WAKE = re.compile(r'^Yes, get this app back up!$', re.I)

          def check(browser, name, url):
              for attempt in range(1, 3):
                  context = browser.new_context(locale='en-US')
                  page = context.new_page()
                  page.set_default_timeout(5000)
                  streams = []

                  def track_socket(ws):
                      if '/_stcore/stream' not in ws.url:
                          return
                      state = {'received': False, 'closed': False}
                      streams.append(state)
                      ws.on('framereceived', lambda _: state.update(received=True))
                      ws.on('close', lambda _: state.update(closed=True))

                  page.on('websocket', track_socket)
                  ready_since = None
                  clicked_at = 0
                  try:
                      print(f'{name}: attempt {attempt}/2', flush=True)
                      page.goto(url, wait_until='domcontentloaded', timeout=60000)
                      deadline = time.monotonic() + 180
                      while time.monotonic() < deadline:
                          ready = False
                          for frame in page.frames:
                              host = urlparse(frame.url).hostname or ''
                              trusted = (host.endswith('.streamlit.app') or
                                         host == 'share.streamlit.io')
                              if not trusted:
                                  continue
                              wake = frame.get_by_role('button', name=WAKE)
                              if wake.count() and wake.first.is_visible():
                                  if time.monotonic() - clicked_at > 30:
                                      wake.first.click(timeout=5000)
                                      clicked_at = time.monotonic()
                                      print(f'{name}: wake requested', flush=True)
                                  continue
                              if host != urlparse(url).hostname:
                                  continue
                              app = frame.locator('[data-testid="stAppViewContainer"]')
                              content = frame.locator(
                                  '[data-testid="stMarkdownContainer"], '
                                  '[data-testid="stHeading"], '
                                  '[data-testid="stTextInput"], '
                                  '[data-testid="stForm"]'
                              )
                              errors = frame.locator('[data-testid="stException"]')
                              visible_error = any(errors.nth(i).is_visible()
                                                  for i in range(errors.count()))
                              rendered = any(content.nth(i).is_visible()
                                             for i in range(content.count()))
                              connected = any(s['received'] and not s['closed']
                                              for s in streams)
                              if (app.count() and app.first.is_visible() and
                                      rendered and connected and not visible_error):
                                  ready = True
                          if ready:
                              if ready_since is None:
                                  ready_since = time.monotonic()
                              if time.monotonic() - ready_since >= 15:
                                  print(f'{name}: PASS (rendered, connected session)', flush=True)
                                  return True
                          else:
                              ready_since = None
                          page.wait_for_timeout(2000)
                      print(f'{name}: session verification timed out', flush=True)
                  except Error:
                      # Do not log page text, screenshots, or potentially sensitive payloads.
                      print(f'{name}: browser/navigation check failed', flush=True)
                  finally:
                      context.close()
              print(f'::error::{name}: could not verify app readiness')
              return False

          results = []
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              try:
                  for name, url in APPS:
                      results.append((name, check(browser, name, url)))
              finally:
                  browser.close()

          stamp = datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d %H:%M:%S KST')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f'## Streamlit check: {stamp}\n\n')
              for name, ok in results:
                  f.write(f'- {name}: {"PASS" if ok else "FAIL"}\n')
              f.write('\nPASS means a rendered Streamlit session with an active connection. '
                      'It does not test database writes or registration features.\n')
          raise SystemExit(0 if all(ok for _, ok in results) else 1)
          PY
