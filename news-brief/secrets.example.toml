# Put the REAL values in Streamlit Cloud > App settings > Secrets.
# Never commit real secrets.toml to GitHub.
[gcp_service_account]
type = "service_account"
project_id = "YOUR_PROJECT_ID"
private_key_id = "YOUR_PRIVATE_KEY_ID"
private_key = "-----BEGIN PRIVATE KEY-----\nYOUR_PRIVATE_KEY\n-----END PRIVATE KEY-----\n"
client_email = "YOUR_SERVICE_ACCOUNT_EMAIL"
client_id = "YOUR_CLIENT_ID"
token_uri = "https://oauth2.googleapis.com/token"

[news_brief]
spreadsheet_id = "YOUR_NEW_NEWS_BRIEF_SPREADSHEET_ID"
admin_password = "REPLACE_WITH_A_LONG_UNIQUE_PASSWORD"
openai_api_key = "" # Optional. Required for AI-generated briefings.
ai_model = "gpt-4.1-mini"
